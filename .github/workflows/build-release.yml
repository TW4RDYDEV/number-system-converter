name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name NumberSystemConverter `
            --icon assets/icon.ico `
            --add-data "app/ui;app/ui" `
            --add-data "assets;assets" `
            --collect-all PySide6 `
            main.py

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $exeName = "NumberSystemConverter-$version-Windows-x64.exe"
          Move-Item "dist/NumberSystemConverter.exe" "dist/$exeName"

          $hash = (Get-FileHash "dist/$exeName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Out-File -Encoding ascii "dist/$exeName.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumberSystemConverter-Windows-x64
          path: dist/NumberSystemConverter*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Number System Converter ${{ github.ref_name }}
          body_path: RELEASE_NOTES_v1.0.0.md
          draft: false
          prerelease: false
          files: |
            dist/NumberSystemConverter-${{ github.ref_name }}-Windows-x64.exe
            dist/NumberSystemConverter-${{ github.ref_name }}-Windows-x64.exe.sha256
