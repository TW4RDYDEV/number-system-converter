[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "number-system-converter"
version = "1.0.0"
description = "A polished desktop number-system converter by TW4RDYDEV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TW4RDYDEV Source-Available License v1.0" }
authors = [
    { name = "TW4RDYDEV" }
]
dependencies = [
    "PySide6>=6.8,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
